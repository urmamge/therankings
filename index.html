<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Rankings</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #f1f0ea; --muted: #9a9993; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { margin: 0; font-size: clamp(2.5rem, 10vw, 5rem); letter-spacing: -0.03em; }
    p { margin: 0.5rem 0 0; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>The Rankings</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
