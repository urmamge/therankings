<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strings | Badminton | The Rankings</title>
  <meta name="description" content="Badminton strings, scored out of 10.">
  <meta name="theme-color" content="#1E6B4B">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/badminton/style.css">
</head>
<body data-ranking="strings">
  <header class="hero">
    <svg class="court" viewBox="0 0 1340 610" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
        <rect x="4" y="4" width="1332" height="602"/>
        <path d="M0 46H1340M0 564H1340M76 0V610M1264 0V610M472 0V610M868 0V610M0 305H472M868 305H1340"/>
        <path class="net" d="M670 0V610"/>
      </svg>
    <nav class="topbar">
      <p class="crumbs"><a href="/">The Rankings</a> <span aria-hidden="true">/</span> <a href="/badminton/">Badminton</a></p>
      <div class="account" id="account"></div>
    </nav>
    <div class="hero-inner">
      <h1 class="sign" id="title">Strings</h1>
      <p class="hero-sub" id="sub"></p>
      <button class="champ" id="champ" hidden></button>
    </div>
  </header>
  <div class="net-band" aria-hidden="true"></div>

  <main>
    <div class="views" role="tablist" aria-label="View">
      <button role="tab" id="tab-items" aria-selected="true" aria-controls="items">All strings</button>
      <button role="tab" id="tab-board" aria-selected="false" aria-controls="board">Scoreboard</button>
    </div>

    <section id="items" role="tabpanel" aria-labelledby="tab-items">
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
          <input id="search" type="search" aria-label="Filter by brand or model">
        </label>
        <div class="tag-filters" id="tag-filters"></div>
        <label class="sort">
          <span>Sort</span>
          <select id="sort">
            <option value="rating-desc">Rating, high to low</option>
            <option value="rating-asc">Rating, low to high</option>
            <option value="az">A to Z</option>
            <option value="za">Z to A</option>
          </select>
        </label>
      </div>
      <div class="brands" id="brands" aria-label="Filter by brand"></div>
      <div class="grid" id="grid" aria-live="polite"></div>
    </section>

    <section id="board" role="tabpanel" aria-labelledby="tab-board" hidden>
      <div class="scoreboard">
        <ol id="board-list"></ol>
      </div>
    </section>
  </main>

  <footer class="foot">
    <a href="/badminton/">All badminton rankings</a>
  </footer>

  <script type="module" src="/badminton/ranking.js"></script>
</body>
</html>
