<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esports teams | Valorant | The Rankings</title>
  <meta name="description" content="Valorant esports teams, scored out of 10.">
  <meta name="theme-color" content="#0F1923">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/videogames/base.css">
  <link rel="stylesheet" href="/videogames/valorant/theme.css">
</head>
<body data-ranking="valorant/teams">
  <header class="hero">
    <nav class="topbar">
      <p class="crumbs"><a href="/">The Rankings</a> <span aria-hidden="true">/</span> <a href="/videogames/">Video games</a> <span aria-hidden="true">/</span> <a href="/videogames/valorant/">Valorant</a></p>
      <div class="account" id="account"></div>
    </nav>
    <div class="hero-inner">
      <h1 class="sign" id="title">Esports teams</h1>
      <p class="hero-sub" id="sub"></p>
      <button class="champ" id="champ" hidden></button>
    </div>
  </header>
  <div class="deco-band" aria-hidden="true"></div>

  <main>
    <div class="views" role="tablist" aria-label="View">
      <button role="tab" id="tab-items" aria-selected="true" aria-controls="items">All esports teams</button>
      <button role="tab" id="tab-board" aria-selected="false" aria-controls="board">Leaderboard</button>
    </div>

    <section id="items" role="tabpanel" aria-labelledby="tab-items">
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
          <input id="search" type="search" aria-label="Filter by name">
        </label>
        <div class="tag-filters" id="tag-filters"></div>
        <label class="sort">
          <span>Sort</span>
          <select id="sort">
            <option value="rating-desc">Rating, high to low</option>
            <option value="rating-asc">Rating, low to high</option>
            <option value="az">A to Z</option>
            <option value="za">Z to A</option>
          </select>
        </label>
      </div>
      <div class="brands" id="brands" aria-label="Filter"></div>
      <div class="grid" id="grid" aria-live="polite"></div>
    </section>

    <section id="board" role="tabpanel" aria-labelledby="tab-board" hidden>
      <div class="scoreboard">
        <ol id="board-list"></ol>
      </div>
    </section>
  </main>

  <footer class="foot">
    <a href="/videogames/valorant/">All Valorant rankings</a>
  </footer>

  <script type="module" src="/videogames/ranking.js"></script>
</body>
</html>
